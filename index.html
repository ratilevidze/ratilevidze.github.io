;play.setAttribute('aria-label',translations[lang].play);seek.setAttribute('aria-label',translations[lang].seek);volume.setAttribute('aria-label',translations[lang].volume);document.querySelectorAll('[data-lang]').forEach(btn=>{let active=btn.dataset.lang===lang;btn.classList.toggle('active',active);btn.setAttribute('aria-pressed',String(active))});render();try{localStorage.setItem('rati-language',lang)}catch(e){}}document.querySelectorAll('[data-lang]').forEach(btn=>btn.addEventListener('click',()=>setLanguage(btn.dataset.lang)));play.addEventListener('click',toggle);audio.addEventListener('play',()=>{play.textContent='Ⅱ';render()});audio.addEventListener('pause',()=>{play.textContent='▶';render()});audio.addEventListener('timeupdate',()=>{document.querySelector('#current').textContent=fmt(audio.currentTime);seek.value=audio.duration?audio.currentTime/audio.duration*100:0});audio.addEventListener('loadedmetadata',()=>document.querySelector('#total').textContent=fmt(audio.duration));seek.addEventListener('input',()=>{if(audio.duration)audio.currentTime=seek.value/100*audio.duration});volume.addEventListener('input',()=>audio.volume=Number(volume.value));audio.volume=.8;audio.addEventListener('ended',()=>{if(selected+1<songs.length)choose(selected+1)});let savedLang='ka';try{savedLang=localStorage.getItem('rati-language')||'ka'}catch(e){}setLanguage(savedLang);fetch('songs.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('songs.json');return r.json()}).then(data=>{if(Array.isArray(data)){songs=data.filter(s=>s&&typeof s.file==='string');render()}}).catch(()=>{});
